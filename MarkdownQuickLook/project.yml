name: MarkdownQuickLook
options:
  bundleIdPrefix: com.cowork.markdownquicklook
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  MarkdownQuickLook:
    type: application
    platform: macOS
    sources:
      - path: MarkdownQuickLook
        excludes:
          - "*.entitlements"
    entitlements:
      path: MarkdownQuickLook/MarkdownQuickLook.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cowork.markdownquicklook
      INFOPLIST_FILE: MarkdownQuickLook/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MarkdownQuickLook/MarkdownQuickLook.entitlements
      PRODUCT_NAME: "Markdown QuickLook"
      ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: MarkdownPreview
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins

  MarkdownPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: MarkdownPreview
        excludes:
          - "*.entitlements"
    entitlements:
      path: MarkdownPreview/MarkdownPreview.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cowork.markdownquicklook.preview
      INFOPLIST_FILE: MarkdownPreview/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MarkdownPreview/MarkdownPreview.entitlements
      PRODUCT_NAME: "Markdown Preview"
      SKIP_INSTALL: YES
      ENABLE_HARDENED_RUNTIME: YES
    dependencies: []
