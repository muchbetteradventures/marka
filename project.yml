name: Marka

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    branch: main

options:
  bundleIdPrefix: com.marka
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Marka:
    type: application
    platform: macOS
    sources:
      - path: Sources/Marka
      - path: Sources/Shared
      - path: AppIcon.icns
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marka.viewer
      PRODUCT_NAME: Marka
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Marka.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      INFOPLIST_FILE: Marka-Info.plist
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: MarkdownPreview
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins

  MarkdownPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/MarkdownPreview
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marka.viewer.preview
      CODE_SIGN_ENTITLEMENTS: MarkdownPreview.entitlements
      PRODUCT_NAME: MarkdownPreview
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      INFOPLIST_FILE: MarkdownPreview-Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SKIP_INSTALL: YES
    dependencies:
      - package: swift-markdown
        product: Markdown
